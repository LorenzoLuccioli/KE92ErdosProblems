name: CI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "KE92ErdosProblems.lean"
      - "KE92ErdosProblems/**/*.lean"
      - "lake-manifest.json"
      - "lakefile.toml"
      - "lean-toolchain"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "KE92ErdosProblems.lean"
      - "KE92ErdosProblems/**/*.lean"
      - "lake-manifest.json"
      - "lakefile.toml"
      - "lean-toolchain"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lean libraries
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          build-args: KE92ErdosProblems
